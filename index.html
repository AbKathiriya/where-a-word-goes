<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Where a Word Goes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sunlit desk with an open notebook. Left page = the lesson (real HTML laid into the 3D scene); right page = a pop-up diorama with a dial, a switch and a readout card. Narrow screens: diorama on top, the pages flatten below. */
:root{
  --desk:#E6E1D7; --paper:#F7F3EA; --paper2:#F3EFE5; --grid:rgba(160,148,124,.16); --ink:#1C1B19; --muted:#6F6A61;
  --accent:#EF6A2C; --gold:#F2B226; --ok:#1F9D6B; --flap:#F6E6BD; --card:#FFFDF8; --blue:#3A6FE0;
  --display:"Poppins",ui-sans-serif,system-ui,sans-serif;
  --body:"Poppins",ui-sans-serif,system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font:14px/1.5 var(--body);overflow:hidden}
body.narrow{overflow:auto;height:auto}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,.knob:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none;background:var(--desk)}
body.narrow #app{height:auto}
body.narrow #stage{flex:none;height:62vh;min-height:360px}
.css3,.gl,.css2{position:absolute!important;inset:0}
.css3{z-index:0}
.gl{z-index:1;pointer-events:none}
.css2{z-index:2;pointer-events:none}
.css2 *{pointer-events:none!important}
.hud{position:absolute;inset:0;z-index:3;pointer-events:none}
.hud>*{pointer-events:auto}

/* HUD */
.badge{position:absolute;top:14px;left:max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:7px 12px 7px;text-align:left;cursor:pointer;line-height:1.2}
.badge b{display:block;font:700 13px var(--display);letter-spacing:-.01em}
.badge span{font:400 10.5px var(--mono);opacity:.75}
.contents{position:absolute;top:62px;left:max(16px,env(safe-area-inset-left,0px));background:var(--card);border:1.5px solid var(--ink);border-radius:8px;padding:8px;display:grid;gap:2px;width:250px;box-shadow:0 4px 0 var(--ink)}
.contents button{display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:center;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:13px}
.contents button:hover,.contents button[aria-current="true"]{background:var(--paper2)}
.contents .n{font:500 11px var(--mono);color:var(--muted)}
.contents .ck{font:500 11px var(--mono);color:var(--ok)}
.hud-r{position:absolute;top:14px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center}
.zoom{background:var(--ink);color:var(--paper);font:500 11px var(--mono);padding:5px 8px;border-radius:5px;font-variant-numeric:tabular-nums}
.recallbtn{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:4px 10px;font:600 12px var(--body);cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.recallbtn i{font:500 11px var(--mono);font-style:normal;background:var(--accent);color:#fff;border-radius:999px;padding:1px 6px;margin-left:4px}
.capbar{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:min(600px,calc(100% - 32px));display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid rgba(28,27,25,.18);border-radius:999px;padding:6px 8px 6px 6px;box-shadow:0 6px 18px rgba(28,27,25,.12)}
.capbar button{border:0;background:transparent;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;flex:none}
.capbar button:hover{background:var(--paper2)}
#cap{flex:1;min-width:0;font-size:13px;line-height:1.3}
#dots{display:flex;gap:4px;flex:none}
#dots i{width:7px;height:7px;border-radius:999px;background:#D8D1C3;transition:width .2s}
#dots i.on{width:18px;background:var(--accent)}
body.narrow .capbar{bottom:10px}

/* 3D page cards (shared by 3D and flat layouts) */
.pg{width:600px;height:780px;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px;color:var(--ink);font-size:12px;line-height:1.45;overflow:hidden;position:relative}
.pg::after{content:"";position:absolute;inset:0 0 0 auto;width:46px;background:linear-gradient(to left,rgba(28,27,25,.13),transparent);pointer-events:none}
.pg-inner{padding:30px 40px 22px 44px;height:100%;display:flex;flex-direction:column;gap:9px}
.kicker{font:500 9.5px var(--mono);letter-spacing:.14em;color:var(--muted);display:flex;align-items:center;gap:7px;text-transform:uppercase}
.kicker .dot{width:11px;height:11px;border:2px solid var(--accent);border-radius:50%;background:radial-gradient(circle,var(--ink) 0 2px,transparent 2.5px)}
.pg h1{font:800 44px/1 var(--display);letter-spacing:-.03em;margin:2px 0 0;text-wrap:balance}
.lede{margin:0;font-size:14px;line-height:1.4;max-width:46ch}
.lab{font:500 9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.box{border:1.4px solid var(--ink);padding:8px 12px 9px;background:rgba(255,253,248,.55)}
.idea{display:flex;flex-direction:column;gap:3px}
.ir{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;font-size:12px}
.ir .ic{display:flex;gap:2px;align-items:center}
.chip{display:inline-block;width:11px;height:9px;border:1.2px solid var(--ink);border-radius:2px;background:var(--c)}
.chip.r{border-radius:50%;width:10px;height:10px}
.kwlab{margin-top:2px}
.kw{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:11px;line-height:1.35}
.kw p{margin:0}
.kw b{font-style:italic;font-weight:600}
.predict{position:relative;display:flex;flex-direction:column;gap:3px}
.predict .q{margin:0;font:600 14px/1.3 var(--display)}
.opts{display:flex;flex-direction:column;gap:1px;align-items:flex-start}
.opt{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:2px 0;cursor:pointer;font-size:12.5px;text-align:left}
.opt i{width:12px;height:12px;border:1.4px solid var(--ink);flex:none}
.opt.on i{background:var(--accent);border-color:var(--accent)}
.opt.on{font-weight:600}
.opt.right{color:var(--ok)}
.opt.right i{border-color:var(--ok)}
.opt:disabled{cursor:default}
.stamp{position:absolute;right:14px;bottom:12px;font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border:2px solid;transform:rotate(-3deg)}
.stamp.ok{color:var(--ok)}
.stamp.no{color:var(--accent)}
.runrow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.run{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border:0;border-radius:7px;padding:10px 16px;font:700 14px var(--display);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.run b{color:var(--accent);font-size:13px}
.run:disabled{opacity:.45;cursor:default}
.guess{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.3}
.flap{background:var(--flap);border:0;border-radius:2px;padding:9px 12px;text-align:left;display:flex;flex-direction:column;gap:1px;cursor:pointer;box-shadow:2px 3px 0 rgba(28,27,25,.12);min-height:72px;clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.flap b{font:700 14px var(--display)}
.flap small{font-size:10.5px;color:var(--muted)}
.flap.locked{opacity:.8;cursor:default}
.exam{border-top:1.4px dashed var(--ink);padding-top:7px;display:flex;flex-direction:column;gap:2px}
.exh{display:flex;justify-content:space-between}
.marks{font:500 10px var(--mono)}
.exam p{margin:0;font-size:12px;font-weight:500}
.exam small{font-size:10px;color:var(--muted)}
.pfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font:500 10px var(--mono);color:var(--muted)}
.pnav{display:flex;gap:6px}
.pnav button{border:1px solid rgba(28,27,25,.3);background:transparent;border-radius:4px;padding:3px 8px;font:500 10px var(--mono);cursor:pointer;color:var(--ink)}
.pnav button:disabled{opacity:.3;cursor:default}
.why{position:absolute;left:24px;right:30px;bottom:24px;background:var(--flap);padding:18px 22px 16px;box-shadow:0 8px 24px rgba(28,27,25,.25);display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.5}
.why p{margin:0}
.whyans{font-size:12.5px}
.fold{align-self:flex-start;border:1.4px solid var(--ink);background:transparent;border-radius:5px;padding:4px 12px;font:600 12px var(--body);cursor:pointer}

.cc{width:300px;height:240px;background-color:var(--paper2);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.cc-row{display:flex;gap:12px;align-items:flex-start;flex:1;min-height:0}
.dial{display:flex;flex-direction:column;align-items:center;width:112px;flex:none}
.dface{position:relative;width:112px;height:92px}
.knob{position:absolute;left:25px;top:15px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#FFE79B,#F2B226 46%,#B5700F 100%);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);cursor:grab;touch-action:none}
.knob .notch{position:absolute;left:50%;top:5px;width:4px;height:15px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.tick{position:absolute;width:2px;height:6px;margin:-3px 0 0 -1px;background:var(--ink)}
.tl{position:absolute;font:500 8.5px var(--mono);color:var(--muted);transform:translate(-50%,-50%);white-space:nowrap;cursor:pointer;background:transparent;border:0;padding:1px}
.tl.on{color:var(--accent)}
.dlab{font:500 8.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.dval{font:600 12px var(--display);white-space:nowrap}
.side{display:flex;flex-direction:column;gap:9px;align-items:flex-start;padding-top:6px;min-width:0}
.sw{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.swr{display:flex;align-items:center;gap:6px;font:500 8.5px var(--mono);color:var(--muted)}
.lever{width:50px;height:28px;background:var(--ink);border-radius:6px;position:relative;border:0;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.lever::before{content:"";position:absolute;width:4px;height:13px;background:#77736b;left:14px;top:7px;border-radius:2px;transform-origin:50% 100%;transform:rotate(-30deg);transition:left .2s,transform .2s}
.lever::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:var(--accent);top:1px;left:5px;transition:left .2s;box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.lever[aria-pressed="true"]::before{left:32px;transform:rotate(30deg)}
.lever[aria-pressed="true"]::after{left:30px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.mini{font:600 11.5px var(--body);padding:5px 11px;border:1.5px solid var(--ink);border-radius:6px;background:var(--card);box-shadow:0 2px 0 var(--ink);cursor:pointer}
.mini.dark{background:var(--ink);color:var(--paper)}
.mini:disabled{opacity:.4;cursor:default}
.turn{font-size:11px;line-height:1.35}
.turn .lab{margin-right:6px}
.fig{font-size:10px;color:var(--muted)}
.fig b{color:var(--ink);font-weight:600}

.ro{width:210px;height:180px;background:#FFFEFB;border:1.6px solid var(--ink);padding:10px 12px 9px;display:flex;flex-direction:column;gap:2px;color:var(--ink);font-variant-numeric:tabular-nums}
.ro-l{font:500 8.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ro-big{font:700 34px/1.05 var(--display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro-sub{font-size:10.5px;line-height:1.3}
.ro-lines{font:400 9.5px/1.45 var(--mono);color:var(--ink);margin-top:2px}
.ro-warn{font:600 9.5px/1.3 var(--mono);color:var(--accent)}
.ro-bar{margin-top:auto}
.ro-bar span{font:500 8px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ro-bar div{height:8px;border:1.3px solid var(--ink);margin-top:2px}
.ro-bar i{display:block;height:100%;background:var(--ok);transition:width .4s}

/* in-scene labels */
.lb{font:500 10px var(--mono);color:var(--muted);white-space:nowrap;background:rgba(247,243,234,.8);padding:1px 5px;border-radius:3px;line-height:1.35;text-align:center}
.lb b{color:var(--ink);font-weight:500}
.wl{font:500 9.5px var(--mono);color:var(--ink);white-space:nowrap;padding:0 3px;border-radius:3px}
.wl.hot{background:var(--ink);color:var(--paper)}
.tid{font:500 10px var(--mono);color:var(--ink);background:var(--card);border:1px solid var(--ink);border-radius:3px;padding:0 4px;white-space:nowrap;transition:opacity .35s}
.nl{font:500 9.5px var(--mono);color:var(--ink);background:var(--card);border:1px solid var(--accent);border-radius:3px;padding:0 5px;white-space:nowrap;transition:opacity .3s}
.ql{font:600 10px var(--mono);color:var(--accent);white-space:nowrap}
.k{display:inline-block;width:9px;height:7px;border:1px solid var(--ink);margin:0 3px 0 6px}
.k.a{background:#2BB3A3}.k.m{background:var(--gold)}
.tagw{width:0;height:0;position:relative}
.tdot{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border:2.5px solid var(--accent);border-radius:50%;background:radial-gradient(circle,var(--ink) 0 3px,transparent 3.5px)}
.tagc{position:absolute;left:14px;bottom:12px;background:#FFFBF0;border:1.5px solid var(--ink);border-radius:3px;padding:7px 11px 8px;font:12px/1.35 var(--body);color:var(--ink);white-space:nowrap;box-shadow:2px 3px 0 rgba(28,27,25,.15)}
.tagc .th{display:flex;align-items:center;gap:6px;font:700 15px var(--display);margin-bottom:2px}
.tagc .th i{width:12px;height:12px;border:2.5px solid var(--accent);border-radius:50%;background:radial-gradient(circle,var(--ink) 0 2px,transparent 2.5px)}
.tagc .tn{font:500 10.5px var(--mono);color:var(--accent);margin-top:3px}

/* flat layout */
#flat{display:none;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.narrow #flat{display:flex;flex-direction:column;gap:14px;align-items:center}
.flatcards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
body.narrow .cc{border:1.4px solid var(--ink);height:auto;min-height:240px}
body.narrow .ro{transform:rotate(-1.5deg)}
body.narrow .pg{width:100%;max-width:600px;height:auto;min-height:0}
body.narrow .pg::after{display:none}
body.narrow .pg-inner{padding:24px 20px 20px}
body.narrow .pg h1{font-size:38px}
body.narrow .kw{grid-template-columns:1fr}
body.narrow .runrow{grid-template-columns:1fr}

/* recall */
.review{position:fixed;inset:0;z-index:20;background:rgba(28,27,25,.45);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rv{width:min(540px,100%);background:#FFFEFA;background-image:linear-gradient(transparent 52px,#F0A7A0 52px,#F0A7A0 54px,transparent 54px),repeating-linear-gradient(transparent 0 27px,#BFD3EE 27px 28px);background-position:0 0,0 54px;border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.3);padding:16px 24px 20px;display:flex;flex-direction:column;gap:12px;min-height:330px;position:relative}
.rv-top{display:flex;justify-content:space-between;align-items:center;height:30px}
.rv-top .lab{color:var(--muted)}
.rv-x{border:0;background:transparent;font-size:20px;cursor:pointer;width:32px;height:32px;border-radius:50%}
.rv-q{font:600 20px/1.35 var(--display);margin:6px 0 0;text-wrap:balance}
.rv-a{font-size:15px;line-height:1.55;border-top:1.4px dashed var(--ink);padding-top:10px;margin:0}
.rv-g{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.rv-g .mini small{display:block;font:400 10px var(--mono);color:var(--muted)}
.rv-g .again{border-color:var(--accent)}
.rv-g .good{border-color:var(--ok)}
.rv-boxes{font:500 10.5px var(--mono);color:var(--muted)}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <div id="stage">
    <div class="hud" id="hud">
      <button class="badge" id="badge" aria-expanded="false" aria-controls="contents"><b>where a word goes.</b><span id="badgeSub">stop 1 of 10 · tokenizer</span></button>
      <div class="contents" id="contents" hidden></div>
      <div class="hud-r"><span class="zoom" id="zoom">×1</span><button class="recallbtn" id="recallBtn" type="button">Recall<i id="dueN">0</i></button></div>
      <div class="capbar"><button id="capPrev" type="button" aria-label="Previous">‹</button><span id="cap"></span><span id="dots"></span><button id="capNext" type="button" aria-label="Next">›</button><button id="capReplay" type="button" aria-label="Replay the experiment">⟳</button></div>
    </div>
  </div>
  <div id="flat"><div class="flatcards" id="flatcards"></div></div>
</div>
<div class="review" id="review" hidden><div class="rv" id="rv"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script>
(async function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=n=>String(n).padStart(2,'0');
const hex=c=>'#'+c.toString(16).padStart(6,'0');
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- persistence ---------- */
let S={};try{S=JSON.parse(localStorage.getItem('wawg.v1')||'{}')||{}}catch(e){S={}}
S.stop=S.stop||0;S.pred=S.pred||{};S.done=S.done||{};S.ctl=S.ctl||{};S.cards=S.cards||{};
const save=()=>{try{localStorage.setItem('wawg.v1',JSON.stringify(S))}catch(e){}};

/* ---------- constants ---------- */
const PX=60, TOP=0.3, PY=0.56;
const DC=new THREE.Vector3(5,TOP,-2.4);
const COL={ink:0x1C1B19,paper:0xF7F3EA,paper2:0xF3EFE5,accent:0xEF6A2C,gold:0xF2B226,ok:0x1F9D6B,blue:0x3A6FE0,teal:0x2BB3A3,rose:0xE0566F,grey:0xBDB6A9,desk:0xE6E1D7,card:0xFFFDF8};
const TOK=[0xF6C44F,0x7FC8F8,0xF28C8C,0x9AD48D,0xC7A4F2,0xF7A86B,0x86D4C9,0xEFA3C8,0xB8D86B,0x9FB4F5,0xF5C7A0];
const chip=(c,r)=>`<i class="chip${r?' r':''}" style="--c:${hex(c)}"></i>`;

/* ---------- tweens ---------- */
const ease={io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,out:t=>1-Math.pow(1-t,3),back:t=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},lin:t=>t};
let tweens=[],INSTANT=false;
function anim(dur,fn,e=ease.io,delay=0){return new Promise(r=>{if(INSTANT||dur<=0){fn(1);r();return}tweens.push({t:-delay,d:dur,fn,e,r})})}
const wait=s=>anim(s,()=>{});

 q:'The reward scorer has a bug: it loves one weird answer. With a very loose leash (small β), what does the model do?',opts:['Ignores the bug','Piles onto the weird answer','Stops changing'],ans:1,

 exam:'What does β control in preference tuning, and what goes wrong when it is too small?',

 build(D){
  const R=D.root,N=56,half=3.2,C=new THREE.Vector3(.4,PY+.04,-.4);const g=(x,z,cx,cz,w)=>Math.exp(-((x-cx)**2+(z-cz)**2)/w);
  const geo=gridGeom(N,half),rg=gridGeom(N,half),P=geo.attributes.position.array,Cl=geo.attributes.color.array,RP=rg.attributes.position.array,cnt=(N+1)*(N+1);
  const xs=[],zs=[];for(let k=0;k<cnt;k++){xs.push(P[k*3]);zs.push(P[k*3+2])}
  const ch=[1.6,1.3],rj=[-1.4,1.5],bug=[-2.3,-2.2];
  const ref=xs.map((x,k)=>g(x,zs[k],0,0,2.6)+.45*g(x,zs[k],1.3,-1.3,1.0));const rs=ref.reduce((a,b)=>a+b,0);for(let k=0;k<cnt;k++)ref[k]/=rs;
  const HS=1.7/Math.max(...ref);for(let k=0;k<cnt;k++)RP[k*3+1]=ref[k]*HS;rg.attributes.position.needsUpdate=true;
  const rm=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:COL.ink,wireframe:true,transparent:true,opacity:.18}));rm.position.copy(C);R.add(rm);
  const pm=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide,transparent:true,opacity:.92}));pm.position.copy(C);pm.castShadow=true;R.add(pm);
  const pin=(p,c,t)=>{const gr=new THREE.Group();const cn=new THREE.Mesh(new THREE.ConeGeometry(.15,.5,16),toon(c));cn.rotation.x=Math.PI;cn.position.y=.25;cn.castShadow=true;edges(cn);gr.add(cn);const ring=new THREE.Mesh(new THREE.RingGeometry(.62,.68,48),basic(c,{side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.01;gr.add(ring);const l=lbl(t,'tid');l.position.y=.75;gr.add(l);gr.position.set(C.x+p[0],C.y,C.z+p[1]);R.add(gr);return gr};
  const pc=pin(ch,COL.ok,'chosen answers'),pr=pin(rj,COL.rose,'rejected answers'),pb=pin(bug,COL.gold,'scorer bug');
  const rl=lbl('wireframe = the original model');rl.position.set(C.x-2.6,PY+.1,C.z+3.4);R.add(rl);
  let t=1;const lo=new THREE.Color(COL.blue),hi=new THREE.Color(COL.ok),tmp=new THREE.Color();
  const reward=(k,b)=>g(xs[k],zs[k],ch[0],ch[1],1.2)-1.2*g(xs[k],zs[k],rj[0],rj[1],1.2)+(b?3*g(xs[k],zs[k],bug[0],bug[1],.22):0);
  function draw(beta,b){const pi=new Float64Array(cnt);let su=0;for(let k=0;k<cnt;k++){pi[k]=ref[k]*Math.exp(t*reward(k,b)/beta);su+=pi[k]}
   let kl=0,er=0,mb=0,mx=0;for(let k=0;k<cnt;k++){pi[k]/=su;if(pi[k]>1e-14)kl+=pi[k]*Math.log(pi[k]/ref[k]);er+=pi[k]*reward(k,false);if(Math.hypot(xs[k]-bug[0],zs[k]-bug[1])<.68)mb+=pi[k];mx=Math.max(mx,pi[k])}
   for(let k=0;k<cnt;k++){P[k*3+1]=Math.min(4.2,pi[k]*HS);tmp.copy(lo).lerp(hi,Math.min(1,pi[k]/mx));Cl[k*3]=tmp.r;Cl[k*3+1]=tmp.g;Cl[k*3+2]=tmp.b}
   geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true;geo.computeVertexNormals();pb.visible=b;return{kl,er,mb}}

   async act(a){if(a==='train'&&!busy&&!touring){busy=true;await anim(2.2,k=>{t=k;readout(draw(beta(),D.v.bug))});busy=false}},
   steps:[{cap:'Every possible answer, spread out. Height = how likely the model is to say it',zoom:'×10',cam:[[.6,5.4,6.6],[.4,.6,-.4]],go:async()=>{t=0;draw(.5,false);pc.scale.setScalar(.01);pr.scale.setScalar(.01);await wait(.3)}},
    {cap:'People preferred answers here over answers there',zoom:'×10',go:async()=>{await anim(.6,k=>{pc.scale.setScalar(.01+k);pr.scale.setScalar(.01+k)},ease.back)}},

 }});

 dials.forEach(c=>buildDial(ccEl.querySelector(`.dial[data-k="${c.k}"]`),c));
 ccEl.querySelectorAll('.lever').forEach(b=>b.addEventListener('click',()=>{if(touring)return;const k=b.dataset.k;v[k]=!v[k];b.setAttribute('aria-pressed',v[k]);save();cur.rt.update()}));
 ccEl.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>cur.rt.act&&cur.rt.act(b.dataset.act)))}
function buildDial(el,c){const v=S.ctl[cur.st.id];const face=el.querySelector('.dface'),out=el.querySelector('.dval');const A0=-135,A1=135;
 const disc=!!c.opts;const n=disc?c.opts.length:0;
 const toAng=val=>disc?A0+(A1-A0)*(n>1?c.opts.indexOf(val)/(n-1):0):A0+(A1-A0)*(val-c.min)/(c.max-c.min);
 const fromAng=a=>{const f=(clamp(a,A0,A1)-A0)/(A1-A0);if(disc)return c.opts[Math.round(f*(n-1))];const raw=c.min+f*(c.max-c.min);return +(Math.round(raw/c.step)*c.step).toFixed(4)};
 const fmt=val=>disc?val:c.fmt(val);
 const knob=document.createElement('div');knob.className='knob';knob.tabIndex=0;knob.setAttribute('role','slider');knob.setAttribute('aria-label',c.label);knob.innerHTML='<i class="notch"></i>';face.appendChild(knob);
 const cx=56,cy=46,rT=40,rL=51;
 const marks=disc?c.opts.map((o,i)=>({val:o,a:toAng(o),txt:n<=4?o:''})):(c.ticks||[]).map(t=>({val:t,a:toAng(t),txt:c.tickFmt?c.tickFmt(t):String(t)}));
 marks.forEach(m=>{const r=m.a*Math.PI/180;const tk=document.createElement('i');tk.className='tick';tk.style.left=(cx+Math.sin(r)*rT)+'px';tk.style.top=(cy-Math.cos(r)*rT)+'px';tk.style.transform=`rotate(${m.a}deg)`;face.appendChild(tk);
  if(m.txt!==''){const b=document.createElement('button');b.type='button';b.className='tl';b.textContent=m.txt;b.style.left=(cx+Math.sin(r)*rL+(Math.abs(m.a)>100?Math.sign(m.a)*6:0))+'px';b.style.top=(cy-Math.cos(r)*rL+(Math.abs(m.a)>100?6:0))+'px';b.addEventListener('click',()=>set(m.val,true));face.appendChild(b);m.el=b}});
 function paint(){knob.style.transform=`rotate(${toAng(v[c.k])}deg)`;out.textContent=fmt(v[c.k]);knob.setAttribute('aria-valuetext',fmt(v[c.k]));marks.forEach(m=>m.el&&m.el.classList.toggle('on',m.val===v[c.k]))}
 let pend=null;function set(val,commit){if(touring)return;if(val===v[c.k]&&!commit)return;v[c.k]=val;paint();save();clearTimeout(pend);pend=setTimeout(()=>cur.rt.update(),disc?0:90)}
 knob.addEventListener('pointerdown',e=>{if(touring)return;knob.setPointerCapture(e.pointerId);knob.style.cursor='grabbing';const mv=ev=>{const r=knob.getBoundingClientRect();const a=Math.atan2(ev.clientX-(r.left+r.width/2),-(ev.clientY-(r.top+r.height/2)))*180/Math.PI;set(fromAng(a))};mv(e);const up=()=>{knob.removeEventListener('pointermove',mv);knob.removeEventListener('pointerup',up);knob.style.cursor=''};knob.addEventListener('pointermove',mv);knob.addEventListener('pointerup',up)});
 knob.addEventListener('keydown',e=>{const d=(e.key==='ArrowRight'||e.key==='ArrowUp')?1:(e.key==='ArrowLeft'||e.key==='ArrowDown')?-1:0;if(!d)return;e.preventDefault();if(disc){const i=clamp(c.opts.indexOf(v[c.k])+d,0,n-1);set(c.opts[i])}else set(+clamp(v[c.k]+d*c.step,c.min,c.max).toFixed(4))});

 const top=`<div class="rv-top"><span class="lab">Recall deck · ${all.length} cards</span><button class="rv-x" type="button" aria-label="Close">×</button></div>`;
 if(!all.length)el.innerHTML=top+`<p class="rv-q">Your deck is empty.</p><p>Run the experiment at any stop. Its exam questions land here and come back on a spaced schedule.</p>`;
 else if(!due.length){const nx=Math.min(...all.map(c=>c.s.due));el.innerHTML=top+`<p class="rv-q">Nothing due right now.</p><p>The next card returns in ${fmtIn(nx-now)}. Recall works best when it is slightly hard, so the gaps are on purpose.</p><div class="rv-g"><button class="mini" type="button" id="rvAhead">Study ahead anyway</button></div>`}
 else{const c=due[0],b=c.s.box,nx=x=>fmtIn(IV[Math.min(IV.length-1,x)]*DAY);
  el.innerHTML=top+`<div class="rv-boxes">Stop ${pad(c.st.n)} · ${c.st.title} · box ${b} · ${due.length} in queue</div><p class="rv-q">${c.q}</p>`+(rvShown?`<p class="rv-a">${c.a}</p><div class="rv-g"><button class="mini again" data-g="0" type="button">Again<small>1 min</small></button><button class="mini good" data-g="1" type="button">Good<small>${nx(b+1)}</small></button><button class="mini" data-g="2" type="button">Easy<small>${nx(b+2)}</small></button></div>`:`<p style="color:var(--muted);font-size:13px;margin:0">Say the answer out loud or write it down before you look.</p><div class="rv-g"><button class="mini dark" type="button" id="rvShow">Show answer</button></div>`)}
 el.querySelector('.rv-x').onclick=closeReview;const sa=el.querySelector('#rvShow');if(sa)sa.onclick=()=>{rvShown=true;renderReview()};const ah=el.querySelector('#rvAhead');if(ah)ah.onclick=()=>{rvAhead=true;renderReview()};
 el.querySelectorAll('[data-g]').forEach(bt=>bt.onclick=()=>{const c=due[0],g=+bt.dataset.g,s=S.cards[c.key];if(g===0){s.box=1;s.due=Date.now()+6e4}else{s.box=Math.min(IV.length-1,s.box+g);s.due=Date.now()+IV[s.box]*DAY}save();rvShown=false;updateDue();renderReview()})}
function openReview(){rvShown=false;rvAhead=false;$('#review').hidden=false;renderReview()}
function closeReview(){$('#review').hidden=true}
$('#recallBtn').addEventListener('click',openReview);
$('#review').addEventListener('click',e=>{if(e.target.id==='review')closeReview()});

/* desk clicks (recall stack) */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let downAt=null;
stage.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY]},true);
stage.addEventListener('pointerup',e=>{if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6)return;if(e.target.closest('.pg,.cc,.ro,.hud'))return;const r=stage.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);if(ray.intersectObjects(stack.children,false).length)openReview()});

/* ---------- loop ---------- */
const clock=new THREE.Clock();
function fixTag(){if(!tagEl.isConnected)return;const c=tagEl.querySelector('.tagc');if(!c)return;const sr=stage.getBoundingClientRect(),tr=tagEl.getBoundingClientRect();const need=tr.left+14+c.offsetWidth>sr.right-12;c.style.left=need?'auto':'14px';c.style.right=need?'14px':'auto';const up=tr.top-12-c.offsetHeight<sr.top+60;c.style.bottom=up?'auto':'12px';c.style.top=up?'12px':'auto'}
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta());tickTweens(dt);if(controls.enabled&&!camBusy)controls.update();renderer.render(scene,camera);if(wide)css3.render(scene,camera);css2.render(scene,camera);fixTag()}

/* ---------- boot ---------- */
try{await Promise.race([Promise.all([document.fonts.load('600 40px Poppins'),document.fonts.load('500 40px "DM Mono"'),document.fonts.load('italic 500 40px Poppins')]),new Promise(r=>setTimeout(r,2500))])}catch(e){}
addEventListener('resize',resize);resize();
const hm=(location.hash||'').match(/^#stop-(\d+)$/);const start=hm?clamp(+hm[1]-1,0,9):clamp(S.stop,0,9);
updateDue();loop();goStop(start,1,true);
setInterval(updateDue,60000);
})();
</script>
